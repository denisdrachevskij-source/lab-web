<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Dead By Daylight — Контакти</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #1b1b1b;
      color: #eee;
    }

    header {
      background-color: #333;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      color: #f05454;
      font-size: 2em;
    }

    nav {
      background-color: #222;
      display: flex;
      justify-content: center;
      padding: 10px 0;
    }

    nav a {
      color: #eee;
      text-decoration: none;
      margin: 0 15px;
      padding: 5px 10px;
      transition: background-color 0.3s;
    }

    nav a:hover {
      background-color: #444;
      border-radius: 5px;
    }

    main {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .contact-info {
      background-color: #222;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px #000;
      text-align: center;
      font-size: 1.1em;
    }

    .contact-info a {
      color: #f05454;
      text-decoration: none;
      transition: color 0.3s;
    }

    .contact-info a:hover {
      color: #ff7b7b;
    }

    footer {
      text-align: center;
      padding: 15px 0;
      background-color: #222;
      color: #888;
    }

    @media (max-width: 600px) {
      nav {
        flex-direction: column;
      }
      nav a {
        margin: 5px 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Dead By Daylight — Контакти</h1>
    <nav>
      <a href="index.html">Головна</a>
      <a href="about.html">Про сайт</a>
      <a href="contacts.html">Контакти</a>
    </nav>
  </header>

  <main>
    <div class="contact-info">
      <p>Електронна пошта: <a href="mailto:denisdrachevskij@gmail.com">denisdrachevskij@gmail.com</a></p>
    </div>
  </main>

  <footer>
    © 2025. Dead By Daylight Fansite
  </footer>
</body>
</html>
